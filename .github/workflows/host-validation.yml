name: Host validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python tools
        run: python -m compileall -q tools
      - name: Compile and test native Future Perfect resource parser
        run: |
          gcc -std=c11 -Wall -Wextra -Isrc -c src/fp_resource.c -o /tmp/fp_resource.o
          gcc -std=c11 -Wall -Wextra -Isrc tests/test_fp_resource.c src/fp_resource.c -o /tmp/test_fp_resource
          /tmp/test_fp_resource
      - name: Compile and test native Future Perfect model parser
        run: |
          gcc -std=c11 -Wall -Wextra -Isrc tests/test_fp_model.c src/fp_model.c -o /tmp/test_fp_model
          /tmp/test_fp_model
      - name: Compile and test native Future Perfect geometry parser
        run: |
          gcc -std=c11 -Wall -Wextra -Isrc tests/test_fp_geometry.c src/fp_geometry.c -o /tmp/test_fp_geometry
          /tmp/test_fp_geometry
      - name: Compile and test native Future Perfect VIF decoder
        run: |
          gcc -std=c11 -Wall -Wextra -Isrc tests/test_fp_vif.c src/fp_vif.c src/fp_vif_memory.c -o /tmp/test_fp_vif
          /tmp/test_fp_vif
      - name: Compile and test native TS3 model parser
        run: |
          gcc -std=c11 -Wall -Wextra -Isrc tests/test_ts3_model.c src/ts3_model.c -lm -o /tmp/test_ts3_model
          /tmp/test_ts3_model
      - name: Validate P5CK synthetic parser
        run: |
          python - <<'PY'
          import struct, tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          import inspect_p5ck
          with tempfile.TemporaryDirectory() as d:
              p = Path(d) / "test.PAK"
              with p.open("wb") as f:
                  f.write(b"P5CK")
                  f.write(struct.pack("<II", 0x20, 16))
                  f.write(b"\0" * (0x20 - f.tell()))
                  f.write(struct.pack("<IIII", 0x12345678, 0x10, 4, 0))
              rows = list(inspect_p5ck.read_entries(p))
              assert rows[0][1] == 0x12345678
          print("P5CK parser validation passed")
          PY
