name: Vita build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-vita:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VPK
        run: cmake --build build -j2
      - name: Verify artifacts
        run: |
          test -s build/TimeSplitters.vpk
          test -s build/eboot.bin
          file build/eboot.bin
          ls -lh build/TimeSplitters.vpk build/eboot.bin
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: TimeSplitters-PSVITA-VPK
          path: build/TimeSplitters.vpk
          if-no-files-found: error
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: TimeSplitters-PSVITA-ELF
          path: build/TimeSplitters
          if-no-files-found: error
