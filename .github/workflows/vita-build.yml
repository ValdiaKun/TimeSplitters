name: Vita build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-vita:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VPK
        run: cmake --build build -j2
      - name: Verify artifacts
        run: |
          test -s build/TimeSplitters.vpk
          test -s build/eboot.bin
          file build/eboot.bin
          ls -lh build/TimeSplitters.vpk build/eboot.bin
      - name: Validate VPK package
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          vpk = Path("build/TimeSplitters.vpk")
          with zipfile.ZipFile(vpk) as z:
              names = set(z.namelist())
              required = {"sce_sys/param.sfo", "eboot.bin"}
              missing = required - names
              if missing:
                  raise SystemExit(f"VPK missing required entries: {sorted(missing)}")
              if z.getinfo("eboot.bin").file_size == 0:
                  raise SystemExit("VPK eboot.bin is empty")
              if z.getinfo("sce_sys/param.sfo").file_size == 0:
                  raise SystemExit("VPK param.sfo is empty")
          print("VPK package validation passed")
          PY
      - name: Upload VPK
        uses: actions/upload-artifact@v6
        with:
          name: TimeSplitters-PSVITA-VPK
          path: build/TimeSplitters.vpk
          if-no-files-found: error
      - name: Upload ELF
        uses: actions/upload-artifact@v6
        with:
          name: TimeSplitters-PSVITA-ELF
          path: build/TimeSplitters
          if-no-files-found: error
