name: VitaSDK Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PSVita VPK
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Verify artifacts
        run: |
          test -s build/TimeSplitters.vpk
          test -s build/eboot.bin
          ls -lh build/TimeSplitters.vpk build/eboot.bin

      - name: Upload Vita artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TimeSplitters-PSVita
          path: |
            build/TimeSplitters.vpk
            build/eboot.bin
          if-no-files-found: error
          retention-days: 14
